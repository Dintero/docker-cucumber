services:
  httpstatus:
    image: ${DOCKER_REGISTRY:-registry-1.docker.io}/library/node:24.14.0-alpine3.22
    environment:
      - NODE_OPTIONS=--experimental-strip-types --no-warnings
      - PORT=80
    volumes: [.:/example]
    command: example/server/http_status.ts

  end-to-end-tests:
    image: ${DOCKER_REGISTRY:-registry-1.docker.io}/dintero/docker-cucumber
    volumes: [.:/usr/src/app/]
    depends_on: [httpstatus]
    command: --require ./test_features.ts features
